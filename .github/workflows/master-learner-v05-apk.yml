name: master-learner-v05-apk

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v05:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct verified 0.4 baseline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          ordered = [
              'part_00.b64',
              'part_01a.b64','part_01b.b64','part_01c.b64',
              'part_02.b64','part_03.b64','part_04.b64','part_05.b64','part_06.b64',
              'part_07a.b64','part_07b.b64','part_07c.b64',
              'part_08a.b64','part_08b.b64','part_08c.b64',
              'part_09a.b64','part_09b.b64','part_09c.b64',
              'part_10a.b64','part_10b1a.b64','part_10b1b.b64','part_10b2.b64','part_10c.b64',
              'part_11a.b64','part_11b.b64',
          ]
          chunks = []
          for name in ordered:
              if name == 'part_03.b64':
                  raw = ''.join(
                      ''.join((Path('ci/v05-baseline') / f'part_03_{i}.b64').read_text().split())
                      for i in range(3)
                  )
              else:
                  raw = ''.join((Path('android-snapshot-v04') / name).read_text().split())
              if name == 'part_10b2.b64':
                  raw = raw[:2000]
              chunks.append(raw)

          joined = ''.join(chunks)
          if len(joined) != 139372:
              raise SystemExit(f'Unexpected 0.4 Base64 length {len(joined)} != 139372')
          payload = base64.b64decode(joined, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          expected = 'e0d817db790b24695476d217671a958129674cb52514220e02acffe802bf97ec'
          print('0.4 source SHA256:', digest)
          if digest != expected:
              raise SystemExit(f'0.4 source checksum mismatch: {digest}')
          Path('/tmp/master-learner-v04.zip').write_bytes(payload)
          PY
          rm -rf source && mkdir source
          unzip -q /tmp/master-learner-v04.zip -d source
          unzip -t /tmp/master-learner-v04.zip >/dev/null
          test -f source/android/settings.gradle.kts

      - name: Verify and apply 0.5 adaptive discovery patch
        shell: bash
        run: |
          cat ci/v05-patch/part_00.b64 ci/v05-patch/part_01.b64 ci/v05-patch/part_02.b64 ci/v05-patch/part_03.b64 ci/v05-patch/part_04.b64 | base64 -d > /tmp/master-learner-v05.patch.gz
          echo '032a177547bba51848cc3f2298c1a553a51c8e86212ecd7305a3297e7dc6ddbe  /tmp/master-learner-v05.patch.gz' | sha256sum --check
          gzip -dc /tmp/master-learner-v05.patch.gz > /tmp/master-learner-v05.patch
          echo '14187217201cc3c2b2dc43363918fd02388ba3c81efbb0616d7b4a8a3f0547c5  /tmp/master-learner-v05.patch' | sha256sum --check
          (cd source && patch -p1 < /tmp/master-learner-v05.patch)
          grep -n 'versionName = "0.5.0-adaptive-discovery"' source/android/app/build.gradle.kts
          grep -n 'versionCode = 5' source/android/app/build.gradle.kts

      - name: Apply Compose typography source migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('source/android/core/designsystem/src/main/java/com/masterlearner/core/designsystem/MasterLearnerTheme.kt')
          text = path.read_text()
          replacements = {
              'TextStyle(FontWeight.SemiBold, 42.sp, 46.sp, letterSpacing = (-0.9).sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 42.sp, lineHeight = 46.sp, letterSpacing = (-0.9).sp)',
              'TextStyle(FontWeight.SemiBold, 34.sp, 39.sp, letterSpacing = (-0.65).sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 34.sp, lineHeight = 39.sp, letterSpacing = (-0.65).sp)',
              'TextStyle(FontWeight.SemiBold, 28.sp, 34.sp, letterSpacing = (-0.4).sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 28.sp, lineHeight = 34.sp, letterSpacing = (-0.4).sp)',
              'TextStyle(FontWeight.SemiBold, 23.sp, 29.sp, letterSpacing = (-0.18).sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 23.sp, lineHeight = 29.sp, letterSpacing = (-0.18).sp)',
              'TextStyle(FontWeight.SemiBold, 20.sp, 26.sp, letterSpacing = (-0.1).sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 20.sp, lineHeight = 26.sp, letterSpacing = (-0.1).sp)',
              'TextStyle(FontWeight.SemiBold, 17.sp, 23.sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 17.sp, lineHeight = 23.sp)',
              'TextStyle(FontWeight.Medium, 15.sp, 20.sp)': 'TextStyle(fontWeight = FontWeight.Medium, fontSize = 15.sp, lineHeight = 20.sp)',
              'TextStyle(FontWeight.Normal, 17.sp, 26.sp)': 'TextStyle(fontWeight = FontWeight.Normal, fontSize = 17.sp, lineHeight = 26.sp)',
              'TextStyle(FontWeight.Normal, 15.sp, 23.sp)': 'TextStyle(fontWeight = FontWeight.Normal, fontSize = 15.sp, lineHeight = 23.sp)',
              'TextStyle(FontWeight.Normal, 13.sp, 19.sp)': 'TextStyle(fontWeight = FontWeight.Normal, fontSize = 13.sp, lineHeight = 19.sp)',
              'TextStyle(FontWeight.SemiBold, 14.sp, 18.sp, letterSpacing = 0.05.sp)': 'TextStyle(fontWeight = FontWeight.SemiBold, fontSize = 14.sp, lineHeight = 18.sp, letterSpacing = 0.05.sp)',
              'TextStyle(FontWeight.Medium, 12.sp, 16.sp, letterSpacing = 0.12.sp)': 'TextStyle(fontWeight = FontWeight.Medium, fontSize = 12.sp, lineHeight = 16.sp, letterSpacing = 0.12.sp)',
              'TextStyle(FontWeight.Bold, 10.sp, 14.sp, letterSpacing = 1.05.sp)': 'TextStyle(fontWeight = FontWeight.Bold, fontSize = 10.sp, lineHeight = 14.sp, letterSpacing = 1.05.sp)',
          }
          changed = 0
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected typography expression missing: {old}')
              text = text.replace(old, new, 1)
              changed += 1
          path.write_text(text)
          print('Named-parameter TextStyle migrations:', changed)
          PY

      - name: Verify exact 0.5 source tree
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('source/android')
          h = hashlib.sha256()
          files = sorted(p for p in root.rglob('*') if p.is_file())
          for p in files:
              h.update(p.relative_to(root).as_posix().encode())
              h.update(b'\0')
              h.update(p.read_bytes())
              h.update(b'\0')
          digest = h.hexdigest()
          expected = 'd614921544d7bec2bc8d7921f1258a54eeab9d023730537b79c630d2b7a52528'
          print('files:', len(files))
          print('0.5 tree SHA256:', digest)
          if digest != expected:
              raise SystemExit(f'0.5 source tree mismatch: {digest}')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests and build 0.5 debug APK
        working-directory: source/android
        shell: bash
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --stacktrace > /tmp/v05-gradle.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== FILTERED BUILD DIAGNOSTICS ==='
            grep -E '(^e: |FAILURE:|What went wrong:|Execution failed for task|Compilation error|error:|FAILED)' /tmp/v05-gradle.log | tail -n 250 || true
            echo '=== LAST 80 LOG LINES ==='
            tail -n 80 /tmp/v05-gradle.log
          fi
          cp /tmp/v05-gradle.log "$GITHUB_WORKSPACE/v05-gradle.log"
          exit "$status"

      - name: Upload 0.5 build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: master-learner-v05-build-diagnostics
          path: v05-gradle.log
          if-no-files-found: error
          retention-days: 7

      - name: Collect and verify APK
        shell: bash
        run: |
          test -f source/android/app/build/outputs/apk/debug/app-debug.apk
          cp source/android/app/build/outputs/apk/debug/app-debug.apk master-learner-0.5.0-adaptive-discovery-debug.apk
          file master-learner-0.5.0-adaptive-discovery-debug.apk
          sha256sum master-learner-0.5.0-adaptive-discovery-debug.apk
          unzip -t master-learner-0.5.0-adaptive-discovery-debug.apk >/dev/null

      - name: Upload installable 0.5 APK
        uses: actions/upload-artifact@v4
        with:
          name: master-learner-v05-debug-apk
          path: master-learner-0.5.0-adaptive-discovery-debug.apk
          if-no-files-found: error
          retention-days: 14
