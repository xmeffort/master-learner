name: master-learner-v04-apk

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'android-snapshot-v04/**'
      - 'ci/v04-trigger.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-v04:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct 0.4 Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, string
          files = sorted(Path('android-snapshot-v04').glob('part_*.b64'))
          allowed = set(string.ascii_letters + string.digits + '+/=')
          chunks=[]
          print('snapshot chunks:')
          for p in files:
              raw=''.join(p.read_text().split())
              bad=[(i,c) for i,c in enumerate(raw) if c not in allowed]
              print(p.name, 'len=', len(raw), 'sha256=', hashlib.sha256(raw.encode()).hexdigest(), 'bad=', bad[:5])
              if bad:
                  raise SystemExit(f'{p}: invalid characters')
              chunks.append(raw)
          joined=''.join(chunks)
          print('joined length:', len(joined), 'mod4:', len(joined)%4)
          print('padding positions:', [i for i,c in enumerate(joined) if c=='='][:10])
          payload=base64.b64decode(joined, validate=True)
          Path('master-learner-v04.zip').write_bytes(payload)
          print('decoded bytes:', len(payload))
          print('zip sha256:', hashlib.sha256(payload).hexdigest())
          PY
          echo "e0d817db790b24695476d217671a958129674cb52514220e02acffe802bf97ec  master-learner-v04.zip" | sha256sum --check
          rm -rf source
          mkdir source
          unzip -q master-learner-v04.zip -d source
          test -f source/android/settings.gradle.kts
          unzip -t master-learner-v04.zip >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests and build 0.4 debug APK
        working-directory: source/android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          test -f source/android/app/build/outputs/apk/debug/app-debug.apk
          cp source/android/app/build/outputs/apk/debug/app-debug.apk master-learner-0.4.0-experience-debug.apk
          sha256sum master-learner-0.4.0-experience-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: master-learner-v04-debug-apk
          path: master-learner-0.4.0-experience-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: master-learner-v04-source
          path: master-learner-v04.zip
          if-no-files-found: error
          retention-days: 14
