name: master-learner-apk

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib

          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          targets = {
              'part_02.b64': 'fb842c230dab05c66beaab8d13de7742e2561d5b18c1480115fd51759691eaef',
              'part_05.b64': '12530daa791d9819de1fbb5cf00837403f417cc5b2fd02e4315294e1c0035937',
          }

          def clean(name):
              return ''.join(Path('android-snapshot', name).read_text().split())

          def repair_one_missing_char(name, value, target):
              if hashlib.sha256(value.encode()).hexdigest() == target:
                  return value
              if len(value) != 15999:
                  raise RuntimeError(f'{name}: expected 15999 chars before repair, got {len(value)}')
              for pos in range(len(value) + 1):
                  left, right = value[:pos], value[pos:]
                  for ch in alphabet:
                      candidate = left + ch + right
                      if hashlib.sha256(candidate.encode()).hexdigest() == target:
                          print(f'{name}: repaired missing character at position {pos}: {ch}')
                          return candidate
              raise RuntimeError(f'{name}: deterministic repair failed')

          ordered = [
              'part_00.b64','part_01.b64','part_02.b64','part_03.b64','part_04.b64',
              'part_05.b64','part_06.b64','part_07a.b64','part_07b.b64','part_07c.b64',
              'part_07d.b64','part_08.b64'
          ]
          chunks = []
          for name in ordered:
              value = clean(name)
              if name in targets:
                  value = repair_one_missing_char(name, value, targets[name])
              chunks.append(value)
              print(name, len(value))

          combined = ''.join(chunks)
          payload = base64.b64decode(combined, validate=True)
          Path('master-learner-android.zip').write_bytes(payload)
          print('decoded bytes:', len(payload))
          print('zip sha256:', hashlib.sha256(payload).hexdigest())
          PY
          echo "dbccdf34a1afd576bdd8c615141d907a527bdd990686dcf3c0efbf49dcdd2597  master-learner-android.zip" | sha256sum --check
          rm -rf source
          mkdir source
          unzip -q master-learner-android.zip -d source
          test -f source/android/settings.gradle.kts
          unzip -t master-learner-android.zip >/dev/null

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 SDK
        shell: bash
        run: yes | sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Run tests and build debug APK
        working-directory: source/android
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          test -f source/android/app/build/outputs/apk/debug/app-debug.apk
          cp source/android/app/build/outputs/apk/debug/app-debug.apk master-learner-0.3.0-adaptive-debug.apk
          sha256sum master-learner-0.3.0-adaptive-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: master-learner-debug-apk
          path: master-learner-0.3.0-adaptive-debug.apk
          if-no-files-found: error
          retention-days: 14
